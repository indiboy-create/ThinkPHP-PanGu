name: Release Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com/
          scope: '@indiboy-create'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error file=package.json::tag ${GITHUB_REF_NAME} 与 package.json version ${VERSION} 不一致"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Verify site
        run: npm run check

      - name: Package dist
        run: |
          cd dist
          zip -r "../pangu-${GITHUB_REF_NAME}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pangu-dist
          path: pangu-*.zip
          if-no-files-found: error

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" "pangu-${GITHUB_REF_NAME}.zip" --clobber